artifact_dirs:
  - /home/build/project/ruby-gem/spec/dummy/tmp/capybara
  - /home/build/project/ruby-gem/spec/dummy/tmp/screenshots
rvm: true
environment:
  RUBY_VERSION: 3.3.5
dependency_roots:
  - path: npm-api-maker
builds:
  setup:
    name: Setup build container
    # Deliberately no `paths` on this build: it is the chained parent and it declares `builds`.
    # TensorBuzz validates every extracted build config standalone, and a config carrying both
    # `paths` and `builds` is rejected there ("Not a build option: paths"), which errors the
    # parent in about a second and leaves every child `new` / `parent_not_succeeded` with no
    # verdict on the delivery. The children below do the filtering; this leg always runs.
    script:
      - cd ruby-gem && bundle install --jobs 4 --without production staging
      # Replace checked-in developer paths before installing the appraisal bundles.
      - cd ruby-gem && bundle exec appraisal generate
      - cd ruby-gem && bundle exec appraisal install
      - cd ruby-gem && bundle exec ruby scripts/provision_geckodriver.rb

      - cd npm-api-maker && yarn link

      - cd ruby-gem/spec/dummy && yarn install --network-timeout 120000
      - cd ruby-gem/spec/dummy && yarn link @kaspernj/api-maker
      - cd ruby-gem/spec/dummy && yarn
      - cd ruby-gem/spec/dummy && bundle exec rails db:environment:set RAILS_ENV=test
      - cd ruby-gem/spec/dummy && bundle exec rails db:schema:load
      - cd ruby-gem/spec/dummy && bundle exec rails runner "ApiMaker::GenerateModelRecipes.execute!"
      - cd ruby-gem/spec/dummy && RAILS_ENV=development bin/shakapacker
    builds:
      build_2:
        name: RSpec Rails 6 Ruby 3.3.5
        paths:
          - ruby-gem/**
          - api_maker_table_rubygem/**
        script:
          - cd ruby-gem && bundle exec appraisal generate && bundle exec appraisal install && bundle exec appraisal "rails 6" rspec --format documentation spec/api_maker spec/services spec/api_helpers
      build_3:
        name: RSpec Rails 7 Ruby 3.3.5
        paths:
          - ruby-gem/**
          - api_maker_table_rubygem/**
        script:
          - cd ruby-gem && bundle exec appraisal generate && bundle exec appraisal install && bundle exec appraisal "rails 7" rspec --format documentation spec/api_maker spec/services spec/api_helpers
      rails_6_chrome:
        name: Chrome Rails 6 Ruby 3.3.5
        paths:
          - ruby-gem/**
          - api_maker_table_rubygem/**
          - npm-api-maker/**
          - "!npm-api-maker/example/**"
          - "!npm-api-maker/changelog.d/**"
        script:
          - cd ruby-gem && bundle exec appraisal generate && bundle exec appraisal install && xvfb-run bundle exec appraisal "rails 6" rspec --format documentation spec/system
      rails_6_firefox:
        name: Firefox Rails 6 Ruby 3.3.5
        paths:
          - ruby-gem/**
          - api_maker_table_rubygem/**
          - npm-api-maker/**
          - "!npm-api-maker/example/**"
          - "!npm-api-maker/changelog.d/**"
        environment:
          SELENIUM_DRIVER: firefox
        script:
          - cd ruby-gem && bundle exec appraisal generate && bundle exec appraisal install && bundle exec appraisal "rails 6" rspec --format documentation spec/system
      rails_7_chrome:
        name: Chrome Rails 7 Ruby 3.3.5
        paths:
          - ruby-gem/**
          - api_maker_table_rubygem/**
          - npm-api-maker/**
          - "!npm-api-maker/example/**"
          - "!npm-api-maker/changelog.d/**"
        script:
          - cd ruby-gem && bundle exec appraisal generate && bundle exec appraisal install && xvfb-run bundle exec appraisal "rails 7" rspec --format documentation spec/system
      rails_7_firefox:
        name: Firefox Rails 7 Ruby 3.3.5
        paths:
          - ruby-gem/**
          - api_maker_table_rubygem/**
          - npm-api-maker/**
          - "!npm-api-maker/example/**"
          - "!npm-api-maker/changelog.d/**"
        environment:
          SELENIUM_DRIVER: firefox
        script:
          - cd ruby-gem && bundle exec appraisal generate && bundle exec appraisal install && bundle exec appraisal "rails 7" rspec --format documentation spec/system
      build_10:
        name: Jest
        paths:
          - npm-api-maker/**
        script:
          - cd npm-api-maker && npm run test
      build_11:
        name: Rubocop
        paths:
          - ruby-gem/**
        script:
          - cd ruby-gem && bundle exec rubocop
      build_12:
        name: Rails Best Practices
        paths:
          - ruby-gem/**
        script:
          - cd ruby-gem && bundle exec rails_best_practices
      build_13:
        name: ESLint
        paths:
          - npm-api-maker/**
        script:
          - cd npm-api-maker && npm run lint:eslint
      build_14:
        name: Expo Doctor
        paths:
          - npm-api-maker/**
        script:
          - cd npm-api-maker && npx expo-doctor
      build_15:
        name: Typecheck
        paths:
          - npm-api-maker/**
        script:
          - cd npm-api-maker && npm run typecheck
